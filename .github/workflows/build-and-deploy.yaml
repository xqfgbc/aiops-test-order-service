name: build-and-deploy
on:
  push:
    branches: [main]
env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: order-service
permissions:
  id-token: write    # OIDC 必需：允许 workflow 请求 JWT
  contents: read     # 允许 actions/checkout 拉代码
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── ① OIDC 换 AWS 临时凭证（核心步骤）──
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # ── ② 登录 ECR ──
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      # ── ③ 构建并推送镜像 ──
      - name: Build, tag, and push image to Amazon ECR
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPO:$IMAGE_TAG
          echo "image=$REGISTRY/$ECR_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT
      # ── ④ 检出 deploy 仓库 ──
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: xqfgbc/aiops-gitops
          token: ${{ secrets.DEPLOY_REPO_PAT }}
          path: deploy
      # ── ⑤ 更新镜像 tag 并回写 ──
      - name: Update image tag in deploy repo
        env:
          NEW_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          cd deploy
          yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' \
            clusters/aiops/apps/order-svc/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add .
          git commit -m "ci: update order-service to ${GITHUB_SHA::7}"
          git push